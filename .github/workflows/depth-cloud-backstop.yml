# .github/workflows/depth-cloud-backstop.yml
# Depth cloud CONTINUITY arm: serves the PC's depth queue while the PC is off.
# Primary = the PC's RS2-Depth-Orchestrator task (every 4h). This fires on the
# same 4h rhythm and runs only when the PC heartbeat is >90min dead (or on
# force); the driver (api_llm/cloud_backstop.py) then computes the SAME queue
# the PC would (orchestrate_depth.build_queue, DEPTH_ORCHESTRATOR_CADENCE
# _20260825.md §3/§5) and serves its head. Operator decision 2026-09-07.
#
# OFF-PEAK ONLY (operator, 2026-09-07): DeepSeek bills double Mon-Fri 01:00-04:00
# and 06:00-10:00 UTC (api_llm/deepseek_offpeak.py). The ladder covers the long
# off-peak stretch (10:00 UTC -> 01:00 UTC next day); a peak-hour arrival (cron
# drift can be 0-9h) skips in preflight, and the driver stops starting tickers
# once the window would close. `force` never bypasses this gate.
name: Depth Cloud Backstop

on:
  schedule:
    - cron: "5 10,14,18,22 * * *"   # 4h ladder inside off-peak (18:05/22:05/02:05/06:05 Taipei)
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the PC-alive gate (never the off-peak gate)"
        type: boolean
        default: false
      max_tickers:
        description: "Max tickers this run"
        default: "6"

concurrency:
  group: depth-backstop
  cancel-in-progress: false

# Ambient token only checks out rs2-local; all cross-repo work uses
# CROSS_REPO_PAT. (NOTE: checkout persists that PAT base64-encoded in each
# clone's .git/config extraheader — never add `set -x` or `git config --list`
# debugging to this file.)
permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      # raw PC heartbeat updated_at (empty when unreadable or forced) — the seed
      # step uses it to prove the rs2-state backup tracked the PC until its death
      hb_updated: ${{ steps.gate.outputs.hb_updated }}
    steps:
      # Only for api_llm/deepseek_offpeak.py + the driver's timeout constant.
      - uses: actions/checkout@v4

      - name: Gate on off-peak window + PC heartbeat
        id: gate
        env:
          SB_URL: ${{ secrets.RS2_SUPABASE_URL }}
          SB_KEY: ${{ secrets.RS2_SUPABASE_SERVICE_KEY }}
          TG_TOKEN: ${{ secrets.RS2_TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.RS2_TG_CHAT_ID }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request
          from datetime import datetime, timezone
          sys.path.insert(0, "api_llm")
          from deepseek_offpeak import run_window_ok
          from cloud_backstop import PER_TICKER_TIMEOUT_S

          def out(run, why, hb_updated=""):
              # single-line values only: strip whatever Supabase handed back
              hb_updated = "".join(str(hb_updated).split())
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"run={'true' if run else 'false'}\n")
                  f.write(f"hb_updated={hb_updated}\n")
              print(f"backstop gate: {why}")

          # Billing gate FIRST and unconditional: no ticker may start unless its
          # whole worst-case runtime is off-peak. Force does not bypass this.
          now = datetime.now(timezone.utc)
          if not run_window_ok(now, PER_TICKER_TIMEOUT_S):
              out(False, f"DeepSeek peak-rate window at {now:%a %H:%M} UTC — "
                         "not running (off-peak only)"); raise SystemExit

          if os.environ.get("FORCE") == "true":
              # hb_updated stays empty: force bypasses the seed-rot check too
              out(True, "forced by operator"); raise SystemExit

          # No overlay-freshness gate any more: continuity means the queue is
          # served on every 4h tick the PC misses, not only once the overlay
          # has gone >30h stale. The driver runs nothing when nothing is due.

          # FAIL CLOSED on heartbeat READ failure: this gate is the only
          # cloud-side interlock against a concurrently-publishing PC (the
          # publish lock is PC-local). Unreadable != dead.
          hb_min = 9999.0
          hb_read_ok = False
          hb_raw = ""
          try:
              url = (os.environ["SB_URL"].rstrip("/")
                     + "/rest/v1/control_heartbeat?id=eq.rs2-pc&select=updated_at")
              req = urllib.request.Request(url, headers={
                  "apikey": os.environ["SB_KEY"],
                  "Authorization": "Bearer " + os.environ["SB_KEY"]})
              with urllib.request.urlopen(req, timeout=30) as r:
                  rows = json.load(r)
              hb_read_ok = True  # empty rows = readable-but-absent = dead
              if rows:
                  hb_raw = str(rows[0]["updated_at"])
                  hb = datetime.fromisoformat(hb_raw.replace("Z", "+00:00"))
                  hb_min = (datetime.now(timezone.utc) - hb).total_seconds() / 60
          except Exception as e:
              print(f"heartbeat read FAILED ({e})")

          print(f"gate inputs: hb_min={hb_min:.0f} hb_read_ok={hb_read_ok}")

          if not hb_read_ok:
              out(False, "heartbeat UNREADABLE — interlock blind, refusing to "
                         "run (force to override)")
              try:
                  tok = os.environ.get("TG_TOKEN"); chat = os.environ.get("TG_CHAT")
                  if tok and chat:
                      body = json.dumps({"chat_id": chat, "text":
                          "[control-tower] depth backstop preflight: heartbeat "
                          "UNREADABLE (Supabase?) — backstop refusing to run; "
                          "dispatch with force=true if the PC is truly dead"}).encode()
                      urllib.request.urlopen(urllib.request.Request(
                          f"https://api.telegram.org/bot{tok}/sendMessage",
                          data=body, headers={"Content-Type": "application/json"}),
                          timeout=15)
              except Exception as alert_err:
                  print(f"alert send failed: {alert_err}")
              raise SystemExit

          if hb_min <= 90:
              out(False, f"PC alive ({hb_min:.0f}m) — its own sweep serves the queue",
                  hb_raw); raise SystemExit
          out(True, f"PC dead {hb_min:.0f}m — cloud serves the depth queue", hb_raw)
          EOF

      # A crashed gate is a SILENT backstop outage: no run, and none of the
      # gate's own Telegram alerts fire (they live inside the step that died).
      - name: Alert on preflight failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.RS2_TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.RS2_TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          tok, chat = os.environ.get("TG_TOKEN"), os.environ.get("TG_CHAT")
          if not (tok and chat):
              raise SystemExit("telegram secrets absent — cannot alert")
          body = json.dumps({"chat_id": chat, "text":
              "[control-tower] depth backstop PREFLIGHT job FAILED — the gate "
              "crashed, so the backstop did not run and its own alerts did not "
              "fire. " + os.environ["RUN_URL"]}).encode()
          # tok only ever inside the URL: never echoed, never logged
          urllib.request.urlopen(urllib.request.Request(
              f"https://api.telegram.org/bot{tok}/sendMessage", data=body,
              headers={"Content-Type": "application/json"}), timeout=15)
          print("preflight failure alert sent")
          EOF

  backstop:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout rs2-local
        uses: actions/checkout@v4
        with:
          path: rs2-local

      - name: Checkout screener data (read)
        uses: actions/checkout@v4
        with:
          repository: riperdy-tech/stock-screener
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: screener
          fetch-depth: 1

      - name: Checkout screener publish clone (write)
        uses: actions/checkout@v4
        with:
          repository: riperdy-tech/stock-screener
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: screener-publish
          fetch-depth: 1

      - name: Checkout rs2-state
        uses: actions/checkout@v4
        with:
          repository: riperdy-tech/rs2-state
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: rs2-state
          fetch-depth: 1

      # The backup is only trustworthy if it tracked the PC up to (near) its
      # last heartbeat. A backup that stopped hours BEFORE the PC died means
      # sync_state was already broken — seeding it would rebuild the overlay
      # from stale state and publish that over the live one.
      - name: Refuse a rotted rs2-state backup
        if: needs.preflight.outputs.hb_updated != ''
        env:
          HB_UPDATED: ${{ needs.preflight.outputs.hb_updated }}
        run: |
          python3 - <<'EOF'
          import json, os
          from datetime import datetime, timezone, timedelta
          hb = datetime.fromisoformat(os.environ["HB_UPDATED"].replace("Z", "+00:00"))
          if hb.tzinfo is None:
              hb = hb.replace(tzinfo=timezone.utc)
          try:
              raw = json.load(open("rs2-state/meta/last_pc_sync.json"))["ts"]
          except Exception as e:
              print(f"::error::cannot read rs2-state/meta/last_pc_sync.json ({e}) — "
                    "backup provenance unknown, refusing to seed")
              raise SystemExit(1)
          sync = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
          if sync.tzinfo is None:
              sync = sync.replace(tzinfo=timezone.utc)
          lag_h = (hb - sync).total_seconds() / 3600
          print(f"backup lag: last_pc_sync={sync.isoformat()} "
                f"last_heartbeat={hb.isoformat()} lag={lag_h:.1f}h")
          if sync < hb - timedelta(hours=2):
              print("::error::rs2-state backup predates the PC's death by >2h — "
                    "backup rotted, refusing to seed")
              raise SystemExit(1)
          EOF

      - name: Seed local state from rs2-state (refuse if ledger missing)
        working-directory: rs2-local
        run: |
          mkdir -p cache
          if [ ! -s ../rs2-state/cache/depth_ledger.jsonl ]; then
            echo "::error::rs2-state has no depth_ledger.jsonl — refusing (a partial ledger would wipe the published overlay)"
            exit 1
          fi
          cp ../rs2-state/cache/depth_ledger.jsonl cache/
          # The PC backs the ledger up mid-append sometimes: guarantee a trailing
          # newline, or publish_cloud_verdicts appends the first cloud row onto a
          # torn final line and the merged line propagates through the delta.
          if [ -n "$(tail -c 1 cache/depth_ledger.jsonl)" ]; then
            echo >> cache/depth_ledger.jsonl
          fi
          # Un-imported rows from a PREVIOUS cloud run (PC hasn't synced since)
          # live only in cloud_pending — seed them too, or this run's overlay
          # rebuild silently reverts that run's verdicts on the site.
          if [ -s ../rs2-state/cloud_pending/depth_ledger_delta.jsonl ]; then
            cat ../rs2-state/cloud_pending/depth_ledger_delta.jsonl >> cache/depth_ledger.jsonl
          fi
          cp ../rs2-state/cache/depth_ondemand_ledger.jsonl cache/ 2>/dev/null || true
          cp ../rs2-state/cache/depth_ondemand.jsonl cache/ 2>/dev/null || true
          # The queue is computed from the PC's state: the membership log drives
          # the dwell clocks (entry dwell, re-entry, exit-review) and
          # depth_state.json carries the per-ticker retry budget. Both are
          # handed back at the end of the run, so consecutive cloud days chain.
          # Missing = dormant dwell / empty state, exactly as on a fresh PC.
          cp ../rs2-state/cache/depth_membership.jsonl cache/ 2>/dev/null || true
          cp ../rs2-state/cache/depth_state.json cache/ 2>/dev/null || true

      - name: Point config at runner paths
        working-directory: rs2-local
        run: |
          python3 - <<'EOF'
          import json, os
          from pathlib import Path
          p = Path("config.json")
          cfg = json.loads(p.read_text(encoding="utf-8"))
          ws = os.environ["GITHUB_WORKSPACE"]
          cfg["screener_data_dir"] = f"{ws}/screener/public/data"
          cfg["screener_publish_repo"] = f"{ws}/screener-publish"
          p.write_text(json.dumps(cfg, indent=2), encoding="utf-8")
          print("patched screener_data_dir + screener_publish_repo")
          EOF

      - name: Write .secrets.json
        working-directory: rs2-local
        env:
          LLM: ${{ secrets.RS2_LLM_API_KEY }}
          TG_TOKEN: ${{ secrets.RS2_TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.RS2_TG_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os
          json.dump({"LLM_API_KEY": os.environ["LLM"],
                     "telegram_bot_token": os.environ.get("TG_TOKEN", ""),
                     "telegram_chat_id": os.environ.get("TG_CHAT", "")},
                    open(".secrets.json", "w"))
          EOF

      - name: Git identity for publish + state push
        run: |
          git config --global user.name "riperdy-tech"
          git config --global user.email "riperdy@gmail.com"

      - name: Start SearXNG (best effort — runs degrade soft without it)
        continue-on-error: true
        working-directory: rs2-local
        run: |
          mkdir -p /tmp/searxng
          cp searxng/settings.yml.example /tmp/searxng/settings.yml
          KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          sed -i "s/secret_key:.*/secret_key: \"$KEY\"/" /tmp/searxng/settings.yml
          docker run -d --name searxng -p 8888:8080 -v /tmp/searxng:/etc/searxng searxng/searxng
          sleep 15
          curl -s -o /dev/null -w "searxng probe: %{http_code}\n" "http://localhost:8888/search?q=test&format=json" || true

      - name: Run continuity driver
        working-directory: rs2-local
        env:
          RS2_STATE_DIR: ${{ github.workspace }}/rs2-state
          BACKSTOP_MAX_TICKERS: ${{ inputs.max_tickers || '6' }}
          # Names analysed at once (operator 2026-09-07): 3 -> six names in ~45
          # min instead of ~2h at the same cost. Kept at 3, not 6, because every
          # search leaves the runner's ONE IP; the driver counts empty/failed
          # searches per run so upstream throttling shows up in the log.
          BACKSTOP_CONCURRENCY: "3"
          # generated_at is naive local time by convention (Taipei on the PC);
          # without this the cloud stamps naive UTC and every consumer reads the
          # overlay 8h older than it is.
          TZ: Asia/Taipei
          # Publish-time TOCTOU re-check: the preflight's "PC dead" verdict is
          # hours old by the time the driver publishes (_pc_alive_recheck).
          RS2_SUPABASE_URL: ${{ secrets.RS2_SUPABASE_URL }}
          RS2_SUPABASE_SERVICE_KEY: ${{ secrets.RS2_SUPABASE_SERVICE_KEY }}
        run: python3 api_llm/cloud_backstop.py

      # Everything after the gate is billable: a crashed job (seed refusal,
      # driver traceback, 340-min timeout) must never be silent.
      - name: Alert on backstop failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.RS2_TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.RS2_TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          tok, chat = os.environ.get("TG_TOKEN"), os.environ.get("TG_CHAT")
          if not (tok and chat):
              raise SystemExit("telegram secrets absent — cannot alert")
          body = json.dumps({"chat_id": chat, "text":
              "[control-tower] depth backstop RUN job FAILED — the overlay was "
              "NOT refreshed (spend may already be incurred). "
              + os.environ["RUN_URL"]}).encode()
          # tok only ever inside the URL: never echoed, never logged
          urllib.request.urlopen(urllib.request.Request(
              f"https://api.telegram.org/bot{tok}/sendMessage", data=body,
              headers={"Content-Type": "application/json"}), timeout=15)
          print("backstop failure alert sent")
          EOF
