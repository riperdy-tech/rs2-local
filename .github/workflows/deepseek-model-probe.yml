# TEMPORARY probe — delete once the V4.1 Flash model id and prices are recorded.
# The dev container cannot answer either question: api.deepseek.com and
# api-docs.deepseek.com are both denied at CONNECT by the egress proxy, and the
# key lives only in .secrets.json (PC) and in this repo's RS2_LLM_API_KEY secret.
# A GitHub-hosted runner has both. Reads only:
#   GET /v1/models   — enumerates the ids the key can actually address. No
#                      completion is requested, so nothing is billed and the
#                      off-peak interlock (deepseek_offpeak.py) is not engaged.
#   the pricing page — primary source for the per-1M rates PRICE[] must carry.
# Never echoes the key.
name: DeepSeek model probe

on:
  push:
    branches: ["claude/deepseek-v4-1-flash-ffjrbk"]
    paths: [".github/workflows/deepseek-model-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List the model ids this key can address
        env:
          LLM: ${{ secrets.RS2_LLM_API_KEY }}
        run: |
          if [ -z "$LLM" ]; then echo "RS2_LLM_API_KEY is empty"; exit 1; fi
          code=$(curl -sS -o /tmp/models.json -w '%{http_code}' --max-time 60 \
                 -H "Authorization: Bearer $LLM" https://api.deepseek.com/v1/models)
          echo "HTTP $code"
          echo "--- model ids ---"
          python3 -c "import json;d=json.load(open('/tmp/models.json'));[print(m['id']) for m in d.get('data',[])]" \
            || cat /tmp/models.json

      - name: Published prices per 1M tokens
        run: |
          curl -sS --max-time 60 https://api-docs.deepseek.com/quick_start/pricing \
            -o /tmp/pricing.html
          python3 - <<'EOF'
          import html, re
          t = open('/tmp/pricing.html', encoding='utf-8', errors='replace').read()
          t = re.sub(r'(?is)<(script|style|svg).*?</\1>', ' ', t)
          t = html.unescape(re.sub(r'(?s)<[^>]+>', '\n', t))
          keep = [l.strip() for l in t.splitlines() if l.strip()]
          print('\n'.join(keep))
          EOF
